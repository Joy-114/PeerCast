<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeerCast · Settings</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">PeerCast <small>0.2.0-alpha</small></a><nav><a href="host.html">Host</a><a href="viewer.html">Viewer</a><a href="about.html">About</a></nav></header><main><h1>Settings</h1><p id="message" class="notice" role="status">设置仅保存在本机。不会自动开始屏幕或麦克风采集。</p><div class="audio-grid"><section class="panel"><h2>DEFAULTS</h2><label for="resolution">Default Resolution</label><select id="resolution"><option value="auto">Auto</option><option value="720">720p</option><option value="1080">1080p</option><option value="native">Native</option></select><label for="fps">Default FPS</label><select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option></select><label for="microphone">Default Microphone</label><select id="microphone"><option value="">System Default</option></select><label for="output">Default Audio Output</label><select id="output"><option value="">System Default</option></select><label for="role">Default Role（启动页面）</label><select id="role"><option value="home">Home</option><option value="host">Host</option><option value="viewer">Viewer</option></select><label><input id="startup" type="checkbox"> Start PeerCast with Windows</label><label for="closeBehavior">Close button behavior</label><select id="closeBehavior"><option value="exit">Exit</option><option value="tray">Minimize to tray（停止当前分享）</option></select><p id="desktopSettingsNote"></p></section><section class="panel"><h2>NETWORK</h2><label for="stun">STUN URL（清空则仅 LAN）</label><input id="stun" type="text" spellcheck="false"><p class="hint">默认使用 Google 公共 STUN；它用于发现网络地址，不中转媒体。可替换为自有服务。</p><label for="turn">Optional TURN URL</label><input id="turn" type="text" placeholder="turn:your-server:3478" spellcheck="false"><label for="turnUser">TURN Username</label><input id="turnUser" type="text" autocomplete="off"><label for="turnPassword">TURN Credential</label><input id="turnPassword" type="password" autocomplete="off"><label><input id="relayOnly" type="checkbox"> Relay only（需要有效 TURN）</label><p class="hint">TURN 配置只保存在本机。桌面版使用 Windows 凭据加密；Web 版保存在此站点的本地存储。没有内置免费 TURN，不保证所有 NAT 可直连。</p></section></div><button class="primary" id="saveSettings">保存设置</button></main><script src="common.js"></script><script src="settings.js"></script><script src="settings-page.js"></script></body></html>
